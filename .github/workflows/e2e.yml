name: E2E Regression

# Emulator-based E2E regression suite. Pre-prod gate: green before deploy.
# See docs/e2e-regression-testing.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4       # required by the Firestore/Auth emulators
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
      - name: Build functions
        run: npm --prefix functions run build
      - name: Install firebase-tools + Playwright browser
        run: |
          npm i -g firebase-tools
          npx playwright install --with-deps chromium
      - name: Use the E2E env (all emulators enabled)
        run: cp .env.e2e .env
      - name: Run data + web E2E against emulators
        env:
          E2E_BASE_URL: http://localhost:8082
        run: |
          firebase emulators:exec \
            --only auth,functions,firestore,storage \
            --project tradie-mate-f852a \
            'bash e2e/ci/run-suite.sh'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Upload Playwright traces/screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e/test-results
          retention-days: 14

  mobile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix functions run build
          npm i -g firebase-tools
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Placeholder — mobile run needs app build wiring
        run: echo "Wire EAS/Expo prebuild + simulator install, then run maestro test .maestro"
