# X3 parity: seeded customer logs in on mobile and reaches the dashboard.
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- tapOn: { id: "input-mobile-number-input" }
- inputText: "0405724199"
- tapOn: { id: "btn-send-otp" }
- tapOn: { id: "input-verification-code-input" }
- inputText: "123456"
- tapOn: { id: "btn-verify-login" }
- assertVisible: { id: "tab-Dashboard" }
